<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
  <h2>Triangle</h2>
  <input type="number" id="Input">
  <button onclick="drawTriangle()">Go</button>
  <pre id="output"></pre>
  <script>
    function drawTriangle() {
      let n = parseInt(document.getElementById("Input").value);
      let result = "";
      if (n%2===0){
          for (let i =1; i<=n; i++){
              let line = '';
              for (let j = 1; j<=i; j++){
                  line += '*';
              }
              result += line + "\n";
          }
      }else{
          for (let i=n; i>=1; i--){
              let line = '';
              for (let j=1; j<=i; j++){
                  line += '*';
              }
              result += line + "\n";
          }
      }
      document.getElementById("output").textContent = result;
    }
  </script>
</body>
</html>
